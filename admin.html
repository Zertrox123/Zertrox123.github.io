<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="static/responsive.css">
</head>
<body>
    <div class="login-container">
        <div class="login-form">
            <h1>🔐 Admin Login</h1>
            <form onsubmit="alert('Administration réservée au backend local Rocket.'); return false;">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="username" style="display: block; margin-bottom: 0.5rem; color: #8b949e;">Nom d'utilisateur :</label>
                    <input type="text" id="username" name="username" style="width: 100%; padding: 0.5rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-family: monospace;" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="password" style="display: block; margin-bottom: 0.5rem; color: #8b949e;">Mot de passe :</label>
                    <input type="password" id="password" name="password" style="width: 100%; padding: 0.5rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-family: monospace;" required>
                </div>
                <button type="submit" class="login">Se connecter</button>
            </form>
            <div class="back-link" style="margin-top: 1.5rem; text-align: center;">
                <a href="index.html" style="color: #58a6ff;">← Retour au portfolio</a>
            </div>
        </div>
    </div>
</body>
</html>
